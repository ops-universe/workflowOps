name: Product website
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: product-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    uses: ops-universe/.github/.github/workflows/reusable-pages-build.yml@d24184214288a97c23ae7a9c2b9d11e710830c15
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  live-smoke:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify deployed public routes
        shell: bash
        run: |
          set -euo pipefail
          base=https://ops-universe.github.io/workflowOps/
          for route in '' features/ documentation/; do
            case "$route" in
              '') title=Home ;;
              features/) title=Features ;;
              documentation/) title=Documentation ;;
            esac
            url="$base$route"
            body="$RUNNER_TEMP/pages-smoke.html"
            ok=0
            for attempt in 1 2 3 4 5; do
              if curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 20 --max-filesize 2097152 --output "$body" "$url" &&
                 grep -Fq "<title>workflowOps — $title</title>" "$body" &&
                 grep -Fq "<link rel=\"canonical\" href=\"$url\">" "$body" &&
                 grep -Fq 'aria-current="page"' "$body" &&
                 grep -Fq 'id="theme-panel"' "$body" &&
                 grep -Fq 'id="search-dialog"' "$body" &&
                 grep -Fq '<style>' "$body" &&
                 grep -Fq 'id="search-index"' "$body"; then
                ok=1
                break
              fi
              if [ "$attempt" -lt 5 ]; then sleep 5; fi
            done
            test "$ok" -eq 1 || { echo "Public route validation failed: $url"; exit 1; }
            echo "Verified public route: $url"
          done
